<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="">
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
         <a href="feedback.html">Info&Feedback</a>
    </nav>
</header>

<section style="width:90%; margin:auto; text-align:center;">

    <h2 class="booking-title">Book Your Stay</h2>

    <form class="booking-form">

        <label>Full Name</label>

        <input type="text" placeholder="Enter your name" required><br><br>

        <label>Email Address</label>

        <input type="email" placeholder="Enter your email" required><br><br>

        <select required>
            <option>Room Type</option>
            <option>Standard Room</option>
            <option>Deluxe Room</option>
            <option>Family Suite</option>
        </select><br><br>

        <input type="date" required>

        <button type="submit">Confirm Booking</button>

    </form>

</section>

<footer>
    <p>Springbok Restings. All rights reserved</p>
</footer>

</body>
</html>
